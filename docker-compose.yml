services:
  db:
    image: postgres:15-alpine
    container_name: sadar_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-sadar_finance}
      POSTGRES_USER: ${DB_USER:-sadar_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sadar_sec_pass_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: sadar_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-sadar_finance}
      DB_USER: ${DB_USER:-sadar_user}
      DB_PASSWORD: ${DB_PASSWORD:-sadar_sec_pass_2026}
      JWT_SECRET: ${JWT_SECRET:-sadar_jwt_super_secret_key_2026}
      JWT_EXPIRES_IN: 7d
      CORS_ORIGINS: "*"
      AI_SERVICE_URL: ${AI_SERVICE_URL:-https://sadar-finance-sadar-finance-ai.hf.space}
      AI_API_KEY: ${AI_API_KEY:-}

  desktop:
    build:
      context: ./frontend
    container_name: sadar_frontend_desktop
    restart: always
    depends_on:
      - backend

  mobile:
    build:
      context: ./frontend-mobile
    container_name: sadar_frontend_mobile
    restart: always
    depends_on:
      - backend

  gateway:
    build:
      context: ./gateway
    container_name: sadar_gateway
    restart: always
    depends_on:
      - desktop
      - mobile
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-app_postgres_data}
