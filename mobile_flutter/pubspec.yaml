name: sadar_finance
description: "SADAR Finance - Smart AI-Driven Automated Receipt & Personal Finance Management (iOS & Android)"
publish_to: 'none'
version: 2.0.0+13

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  fl_chart: ^0.70.2
  intl: ^0.20.2
  image_picker: ^1.1.2
  http_parser: ^4.1.2
  connectivity_plus: ^6.1.4
  crypto: ^3.0.6
  url_launcher: ^6.3.1
  shorebird_code_push: ^2.0.4
  local_auth: ^2.3.0
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  google_sign_in: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/sadar-logo.png
    - assets/images/logo-sadar-light.png
    - assets/images/logo-sadar-full.png
    - assets/images/logo-sm.png
