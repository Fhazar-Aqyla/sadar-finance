map $cookie_sadar_mobile_ui $mobile_frontend_upstream {
    default mobile;
    legacy  desktop;
    modern  mobile;
}

map $http_user_agent $frontend_upstream {
    default                                      desktop;
    ~*(android|iphone|ipod|ipad|mobile|opera\ mini|iemobile) $mobile_frontend_upstream;
}

upstream api_backend {
    server backend:5000;
}

upstream desktop_frontend {
    server desktop:80;
}

upstream mobile_frontend {
    server mobile:80;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 12m;
    resolver 127.0.0.11 valid=30s ipv6=off;

    location /api/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location = /health {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health/db {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /mobile-ui-choice.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, max-age=0" always;
    }

    # PWA resources belong to the mobile application and must not depend on
    # User-Agent routing because service-worker subrequests can be UA-neutral.
    location ~ ^/(manifest\.webmanifest|sw\.js|offline\.html|pwa-(192|512|maskable-512)\.png)$ {
        proxy_pass http://mobile_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The public landing page is always the desktop design. Its hashed assets
    # use a dedicated prefix so a mobile user preference cannot reroute them.
    location = / {
        add_header Vary "User-Agent, Cookie" always;
        proxy_pass http://desktop_frontend;
        proxy_http_version 1.1;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        sub_filter_once off;
        sub_filter '"/assets/' '"/desktop-assets/';
        sub_filter '</body>' '<script src="/mobile-ui-choice.js" defer></script></body>';
    }

    location ^~ /desktop-assets/ {
        rewrite ^/desktop-assets/(.*)$ /assets/$1 break;
        proxy_pass http://desktop_frontend;
        proxy_http_version 1.1;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header ETag;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        sub_filter_once off;
        sub_filter_types application/javascript text/css;
        sub_filter '/assets/' '/desktop-assets/';
    }

    location / {
        add_header Vary "User-Agent, Cookie" always;
        proxy_pass http://$frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        sub_filter_once on;
        sub_filter '</body>' '<script src="/mobile-ui-choice.js" defer></script></body>';
    }
}
