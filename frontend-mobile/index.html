<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/browser-tab-icon.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e3a8a" />
    <meta name="description" content="SADAR Finance - aplikasi pencatatan dan pemantauan keuangan pribadi." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SADAR" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>SADAR Finance</title>
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('sadar_theme_mode') || localStorage.getItem('layoutMode');
          if (mode === 'dark') {
            document.documentElement.setAttribute('data-bs-theme', 'dark');
          } else if (mode === 'light') {
            document.documentElement.setAttribute('data-bs-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
