<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1e3a8a" />
    <title>SADAR Finance - Offline</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #172033; background: #f8fbff; font-family: Inter, system-ui, sans-serif; }
      main { width: min(100%, 420px); padding: 32px 24px; border: 1px solid #dbeafe; border-radius: 24px; text-align: center; background: #fff; box-shadow: 0 18px 48px rgba(30, 58, 138, .12); }
      img { width: 56px; height: 56px; object-fit: contain; }
      h1 { margin: 18px 0 8px; color: #1e3a8a; font-size: 24px; }
      p { margin: 0 0 20px; color: #64748b; line-height: 1.6; }
      button { min-height: 44px; border: 0; border-radius: 12px; padding: 0 20px; color: #fff; background: #1e3a8a; font: inherit; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa-192.png" alt="Logo SADAR" />
      <h1>Koneksi terputus</h1>
      <p>Sambungkan perangkat ke internet, lalu coba buka SADAR Finance kembali.</p>
      <button type="button" onclick="location.reload()">Coba Lagi</button>
    </main>
  </body>
</html>
